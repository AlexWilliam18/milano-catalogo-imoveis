name: Atualizar catálogo de imóveis

on:
  schedule:
    - cron: "7 * * * *"   # a cada hora (horário UTC), no minuto 7
  workflow_dispatch:       # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar catálogo
        env:
          BASE_URL: https://www.imobiliariamilano.com.br
          NOME_IMOBILIARIA: Milano Aluguel e Venda de Imóveis
        run: python catalogo.py

      - name: Publicar se houve mudança
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza catálogo de imóveis"
            git push
          fi
